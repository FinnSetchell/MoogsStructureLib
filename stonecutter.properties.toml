deps.cloth_config = "16.0.143"
deps.modmenu = "12.0.1"

# Forge has no 1.21.2 build, so this one compiles against 1.21.3.
[forge."1.21.2"]
mod.mc_build = "1.21.3"
mod.mc_compat = "[1.21.2,1.21.4)"
deps.forge = "53.1.0"
deps.forge_range = "[53,)"
deps.cloth_config = "16.0.143"

[neoforge."1.21.2"]
deps.neoforge_min = "21.2.1-beta"
