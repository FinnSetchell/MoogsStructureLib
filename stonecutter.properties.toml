# Per-node values. Mod metadata that never varies stays in gradle.properties.
# Tables are picked per node by `properties { tags(version, loader) }` in stonecutter.gradle.kts, so
# `deps.fabric_api` resolves to whatever the matching [fabric."<version>"] table declares.
#
# A node's version (the table name) is what `//? if` conditions compare against. mod.mc_build is the
# Minecraft version it compiles against, which is usually the same but not always.
# mod.mc_compat is the range the jar declares, in each loader's own syntax.
# mod.access picks the access widener / transformer pair in src/main/access.

# Loom for the obfuscated versions, applied by dev.kikugie.loom-back-compat.
loomx.loom_version = "1.17-SNAPSHOT"
deps.mixinextras = "0.5.3"

# ------------------------------------------------------------------ 1.20-1.20.4 (Java 17)
["1.20"]
mod.java = "17"
mod.access = "classic"

[fabric."1.20"]
mod.mc_build = "1.20"
mod.mc_compat = ">=1.20 <1.20.5"
mod.fabric_loader_dep = ">=0.14.25"
mod.fabric_aw_entry = "true"
deps.fabric_loader = "0.14.25"
deps.fabric_api = "0.83.0+1.20"
deps.cloth_config = "11.0.99"
deps.modmenu = "7.2.2"

# Built by build.forge-legacy.gradle.kts: Forge before 1.20.5 needs a reobfuscated jar.
[forge."1.20"]
mod.mc_build = "1.20"
mod.mc_compat = "[1.20,1.20.5)"
deps.forge = "46.0.14"
deps.forge_range = "[46,)"
deps.cloth_config = "11.0.99"
deps.cloth_config_loader = "forge"
mod.forge_compile_excludes = ""

