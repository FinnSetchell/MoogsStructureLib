plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

def loaderProjects = subprojects.findAll { it.name in ['fabric', 'neoforge', 'forge'] && new File(it.projectDir, 'build.gradle').exists() }

tasks.register('collectJars', Copy) {
    loaderProjects.each { sub ->
        // forge ships the JiJ jar (bundled MixinExtras); its plain 'jar' is the -slim variant
        def jarTask = sub.name == 'forge' ? 'jarJar' : 'jar'
        dependsOn "${sub.path}:${jarTask}"
        from(sub.tasks.named(jarTask).flatMap { it.archiveFile })
    }
    into layout.buildDirectory.dir('libs')
}

tasks.register('build') {
    loaderProjects.each { sub -> dependsOn "${sub.path}:build" }
    finalizedBy 'collectJars'
}
