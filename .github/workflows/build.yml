name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['*.*.*-*.*.*']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every Stonecutter node compiles on its own toolchain: 17 for 1.20-1.20.4, 21 up to 1.21.11,
      # 25 for 26.x. The last one listed becomes JAVA_HOME and runs Gradle.
      - name: Set up Java 17, 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build every node
        run: ./gradlew buildAndCollect

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/*/*.jar
