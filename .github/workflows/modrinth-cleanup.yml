# Thin caller for the reusable Modrinth duplicate-version cleanup.
#
# Manual only. Default mode is 'report', which performs no writes at all —
# run that first, read the plan, then re-run with mode=delete and
# confirm=DELETE-DUPLICATES if the plan looks right.
#
# The Modrinth token is account-scoped, so this caller can clean up any project
# the account owns, not just this repo's.

name: Modrinth cleanup

on:
  workflow_dispatch:
    inputs:
      projectId:
        description: 'Modrinth project id or slug'
        type: string
        required: true
      mode:
        description: 'report (read-only) or delete'
        type: choice
        options: [report, delete]
        default: report
      confirm:
        description: "Type DELETE-DUPLICATES to arm mode=delete"
        type: string
        required: false
        default: ''

jobs:
  cleanup:
    uses: FinnSetchell/release-actions/.github/workflows/modrinth-cleanup.yml@main
    with:
      projectId: ${{ inputs.projectId }}
      mode: ${{ inputs.mode }}
      confirm: ${{ inputs.confirm }}
    secrets: inherit
