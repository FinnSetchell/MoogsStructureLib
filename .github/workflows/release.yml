# Runs when a release tag is pushed, for example 3.5.0-fabric. It builds the jars and posts a
# review card in Discord. The publishing code lives in the private release-actions repo, so this
# checks it out with RELEASE_ACTIONS_TOKEN and runs it from there.

name: Release

on:
  push:
    tags: ['*.*.*-*', '*.*.*-alpha.*-*']

permissions:
  contents: write

jobs:
  release:
    name: Plan, build, review card
    runs-on: ubuntu-latest
    concurrency:
      group: mods-release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout mod at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0   # full history + branches for the plan's branch sanity check

      - name: Checkout release-actions
        uses: actions/checkout@v4
        with:
          repository: FinnSetchell/release-actions
          ref: v2
          path: .release-actions
          # || github.token kept for resilience even though the fine-grained
          # PAT is required while the repo is private — a public fallback
          # costs nothing and self-heals if release-actions is ever opened up.
          token: ${{ secrets.RELEASE_ACTIONS_TOKEN || github.token }}

      - name: Release
        uses: ./.release-actions/actions/release-plan
        with:
          worker_api_key: ${{ secrets.WORKER_API_KEY }}
