# Started by the Discord bot while a release waits in CurseForge's approval queue, to check
# whether it has gone live yet. The bot calls this file by name with exactly these inputs, so
# don't rename it or change them.

name: Verify

on:
  workflow_dispatch:
    inputs:
      tag: {type: string, required: true}
      releaseId: {type: string, required: true}
      runId: {type: string, required: true}

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify & notify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release-actions
        uses: actions/checkout@v4
        with:
          repository: FinnSetchell/release-actions
          ref: v2
          path: .release-actions
          token: ${{ secrets.RELEASE_ACTIONS_TOKEN || github.token }}

      - name: Verify (recheck)
        uses: ./.release-actions/actions/verify-recheck
        with:
          tag: ${{ inputs.tag }}
          releaseId: ${{ inputs.releaseId }}
          runId: ${{ inputs.runId }}
          worker_api_key: ${{ secrets.WORKER_API_KEY }}
          discord_alert_webhook: ${{ secrets.DISCORD_ALERT_WEBHOOK }}
