# Publishing settings for release-actions. Only the copy on main is read.
schema: 1
mod:
  id: msl
  displayName: "Moog's Structure Lib"
  environments: [Server]
  name: MoogsStructureLib
  validate: false
platforms:
  curseforge: { projectId: 1337167, slug: moogs-structure-lib }
  modrinth:   { projectId: 1oUDhxuy, slug: moogs-structure-lib }
discord:
  embedColor: "#39313f"
  avatarUrl: "https://media.forgecdn.net/avatars/thumbnails/1441/422/256/256/638934552218182240.webp"
  bannerUrl: "https://www.bisecthosting.com/images/CF/Moogs_Structure_Lib/MP_MoogsStructureLib_header.webp"
  thumbnailUrl: "https://media.forgecdn.net/avatars/thumbnails/1441/422/64/64/638934552218182240.webp"
  pingDefault: true
artifacts:
  - type: mod-jar
# Each loader has its own target and its own release tag: 3.5.0-fabric, 3.5.0-forge and
# 3.5.0-neoforge. Each build is one node from settings.gradle.kts. When a jar covers more than
# one Minecraft version, `from` and `upTo` set the range it is published for.
#
# `java` is the Java that runs Gradle. It is 25 for everything; the Java 17 and 21 toolchains the
# older nodes compile with are downloaded automatically.
targets:
  - branch: main
    tagLabel: fabric
    loaders: [fabric]
    buildCommand: ":{mc}-fabric:build"
    jarDir: "versions/{mc}-fabric/build/libs"
    builds:
      - { mc: "1.20", upTo: "1.20.4", java: 25 }
      - { mc: "1.20.6", from: "1.20.5", java: 25 }
      - { mc: "1.21.1", from: "1.21", java: 25 }
      - { mc: "1.21.2", upTo: "1.21.3", java: 25 }
      - { mc: "1.21.4", java: 25 }
      - { mc: "1.21.5", upTo: "1.21.8", java: 25 }
      - { mc: "1.21.10", java: 25 }
      - { mc: "1.21.11", java: 25 }
      - { mc: "26.1.2", from: "26.1", java: 25 }
      - { mc: "26.2", java: 25 }
      - { mc: "26.3", java: 25 }
  - branch: main
    tagLabel: forge
    loaders: [forge]
    buildCommand: ":{mc}-forge:build"
    jarDir: "versions/{mc}-forge/build/libs"
    # No Forge for 1.20.5-1.20.6, or for 1.21.5-1.21.8 yet.
    builds:
      - { mc: "1.20", upTo: "1.20.4", java: 25 }
      - { mc: "1.21.1", from: "1.21", java: 25 }
      - { mc: "1.21.2", upTo: "1.21.3", java: 25 }
      - { mc: "1.21.4", java: 25 }
      - { mc: "1.21.10", java: 25 }
      - { mc: "1.21.11", java: 25 }
      - { mc: "26.1.2", from: "26.1.1", java: 25 }
      - { mc: "26.2", java: 25 }
      - { mc: "26.3", java: 25 }
  - branch: main
    tagLabel: neoforge
    loaders: [neoforge]
    buildCommand: ":{mc}-neoforge:build"
    jarDir: "versions/{mc}-neoforge/build/libs"
    # No 1.20.5: NeoForge's 1.20.5 betas can't run MSL on a server.
    builds:
      - { mc: "1.20.6", java: 25 }
      - { mc: "1.21.1", from: "1.21", java: 25 }
      - { mc: "1.21.2", upTo: "1.21.3", java: 25 }
      - { mc: "1.21.4", java: 25 }
      - { mc: "1.21.5", upTo: "1.21.8", java: 25 }
      - { mc: "1.21.10", java: 25 }
      - { mc: "1.21.11", java: 25 }
      - { mc: "26.1.2", from: "26.1", java: 25 }
      - { mc: "26.2", java: 25 }
      - { mc: "26.3", java: 25 }
