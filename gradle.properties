# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# Project
mod_id=moogs_structures
mod_version=3.3.0
mod_name=Moog's Structure Lib
mod_author=FinnDog
maven_group=com.finndog.moogs_structures
archives_base_name=MoogsStructureLib
license=LGPL-3.0
description=A structure library for Minecraft mods.

# Java
java_version=25

# Minecraft
minecraft_version=26.3
minecraft_version_range=26.3

# NeoForge
neo_version=26.3.0.1-beta
neoforge_loader_version_range=[4,)
# Find the correct NeoForm version at: https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric
fabric_loader_version=0.19.5
fabric_version=0.160.6+26.3

# In-game config screen (Cloth Config) - soft dependency, compiled against but not bundled or required at runtime.
# Cloth Config 26.3.158 targets MC 26.3 (fabric + neoforge). ModMenu 21.0.0-beta.1 is the only 26.3 build so far (fabric only).
cloth_config_fabric_version=26.3.158
cloth_config_neoforge_version=26.3.158
modmenu_version=21.0.0-beta.1


# Forge: no 26.3 build exists yet (maven last updated 2026-08-27). Module is excluded in settings.gradle until one ships.
forge_minecraft_version=26.3
forge_minecraft_version_range=[26.3,26.3]
forge_version=65.1.2
forge_loader_version_range=[65,)
