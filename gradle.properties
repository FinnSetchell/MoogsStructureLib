# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# Project
mod_id=moogs_structures
mod_version=3.2.0-alpha.1
mod_name=Moog's Structure Lib
mod_author=FinnDog
maven_group=com.finndog.moogs_structures
archives_base_name=MoogsStructureLib
license=LGPL-3.0
description=A structure library for Minecraft mods.

# Java
java_version=25

# Minecraft
minecraft_version=26.1.2
minecraft_version_range=26.1.0-26.1.2

# NeoForge
neo_version=26.1.2.7-beta
neoforge_loader_version_range=[4,)
# Find the correct NeoForm version at: https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Fabric
fabric_loader_version=0.19.1
fabric_version=0.145.4+26.1.2

# In-game config screen (Cloth Config) - soft dependency, compiled against but not bundled or required at runtime.
# Cloth Config 26.1.154 targets MC 26.1.x (fabric + neoforge). ModMenu 18.0.0 targets MC 26.1.x (fabric only).
cloth_config_fabric_version=26.1.154
cloth_config_neoforge_version=26.1.154
modmenu_version=18.0.0

# Forge (gated to 26.1.1+; no Forge release exists for 26.1.0)
# Compile against Forge 63.x (targets MC 26.1.1) with loader range [63,) so
# both 63 and 64 loaders accept the jar.
forge_minecraft_version=26.1.1
forge_minecraft_version_range=[26.1.1,26.1.2]
forge_version=63.0.2
forge_loader_version_range=[63,)
