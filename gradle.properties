# Loader list shown in the Discord release announcement (the "Versions - X.Y | ..." line).
# Update this when the set of jars actually uploaded to CurseForge / Modrinth changes.
publish_loaders=Fabric, NeoForge & Forge

# Alpha publish mode.
# When true: CurseForge + Modrinth uploads are marked as ALPHA release type,
# the GitHub release is created as a pre-release, the Discord announcement
# is posted to the DISCORD_ALPHA_WEBHOOK_URL env var (e.g. #test-builds) instead
# of the public DISCORD_WEBHOOK, the jar archivesName picks up an -alpha suffix,
# and the Discord embed shows one download button per uploaded jar (one per
# loader x platform) instead of the curated CurseForge / Modrinth versions links
# used in stable mode.
alphaBuild=false


# Publish (release-actions Discord-gated workflow)
modName=Moog's Structure Lib
minecraftVersion=1.21.8
