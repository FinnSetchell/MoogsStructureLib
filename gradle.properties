# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# Project
mod_id=moogs_structures
mod_version=3.2.0
mod_name=Moog's Structure Lib
mod_author=FinnDog
maven_group=com.finndog.moogs_structures
archives_base_name=MoogsStructureLib
license=LGPL-3.0
description=A structure library for Minecraft mods.

# Java
java_version=25

# Minecraft
minecraft_version=26.2
minecraft_version_range=26.2

# NeoForge
neo_version=26.2.0.6-beta
neoforge_loader_version_range=[4,)
# Find the correct NeoForm version at: https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-1

# Fabric
fabric_loader_version=0.19.3
fabric_version=0.152.2+26.2

# In-game config screen (Cloth Config) - soft dependency, compiled against but not bundled or required at runtime.
# Cloth Config 26.2.155 targets MC 26.2.x (fabric + neoforge). ModMenu 20.0.1 targets MC 26.2.x (fabric only).
cloth_config_fabric_version=26.2.155
cloth_config_neoforge_version=26.2.155
modmenu_version=20.0.1


# Forge (26.2-65.x). Loader range [65,) so later 65.x loaders accept the jar.
forge_minecraft_version=26.2
forge_minecraft_version_range=[26.2,26.2]
forge_version=65.1.2
forge_loader_version_range=[65,)
